<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>基本情報過去問題</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>基本情報過去問題</h1>

  <div class="quiz-container">
    <!-- 何問目か表示 -->
    <div id="progress" class="progress"></div>

    <!-- 現在の問題を表示する枠 -->
    <div id="question-area" class="question-block">
      <p id="question-text" class="question-text"></p>
      <div id="choices-area"></div>
    </div>

    <!-- 回答後に正誤＋解説を表示する枠 -->
    <div id="feedback" class="feedback">
      <div id="judge"></div>
      <p id="your-answer"></p>
      <p id="correct-answer"></p>
      <p id="explanation"></p>
    </div>

    <!-- ボタン類 -->
    <div class="button-area">
      <button id="submitBtn">この問題を採点する</button>
      <button id="nextBtn" class="secondary" disabled>次の問題へ</button>
    </div>

    <!-- 最終スコア表示用 -->
    <div id="final-score" class="final-score"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
